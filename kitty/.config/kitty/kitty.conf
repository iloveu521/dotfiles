# Handwritten Wayland terminal profile for the Neovim environment.
font_family JetBrainsMono NF
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0

background_opacity 0.90
dynamic_background_opacity yes
window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no
# shell_integration enabled  # needs kitty >= 0.24; apt ships 0.21

hide_window_decorations no
wayland_titlebar_color system

# Wayland 下的默认尺寸；GNOME 的自动最大化策略由 gnome/settings.dconf 关闭
remember_window_size yes
initial_window_width 216c
initial_window_height 55c

placement_strategy center

# Ctrl+C：复制鼠标选中的文字
map ctrl+c copy_to_clipboard

# Ctrl+V：粘贴
map ctrl+v paste_from_clipboard

# Ctrl+Shift+C：发送原来的 Ctrl+C，中止当前命令
map ctrl+shift+c send_key ctrl+c

# 右键直接粘贴系统剪贴板，兼容普通终端模式和程序接管鼠标时的模式
mouse_map right click ungrabbed,grabbed paste_from_clipboard

cursor #5de4c7
cursor_text_color #11111b
foreground #cdd6f4
background #11111b
selection_foreground #cdd6f4
selection_background #45475a
url_color #89b4fa

color0 #45475a
color1 #f38ba8
color2 #5de4c7
color3 #f9e2af
color4 #89b4fa
color5 #c6a0f6
color6 #5de4c7
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #5de4c7
color11 #f9e2af
color12 #89b4fa
color13 #c6a0f6
color14 #74c7ec
color15 #cdd6f4

tab_bar_style powerline
active_tab_foreground #11111b
active_tab_background #c6a0f6
inactive_tab_foreground #a6adc8
inactive_tab_background #181825

# Function-key controls
map f1 toggle_maximized
map f2 kitten toggle_decorations.py
map f3 new_tab_with_cwd
