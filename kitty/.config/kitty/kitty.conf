# Handwritten Wayland terminal profile for the Neovim environment.
# =======================
# Font
# =======================
font_family JetBrainsMono NF 
bold_font auto
italic_font auto
bold_italic_font auto

font_size 18.0

disable_ligatures never

# ==================
# Cursor
# =================

cursor_shape beam
cursor_blink_interval 0.5

background_opacity 0.85
dynamic_background_opacity yes
window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no
# shell_integration enabled  # needs kitty >= 0.24; apt ships 0.21

hide_window_decorations no
wayland_titlebar_color system

# Wayland 下的默认尺寸；GNOME 的自动最大化策略由 gnome/settings.dconf 关闭
remember_window_size no
initial_window_width 175c
initial_window_height 42c

placement_strategy center

# Ctrl+C：复制鼠标选中的文字
map ctrl+c copy_to_clipboard

# Ctrl+V：粘贴
map ctrl+v paste_from_clipboard

# Ctrl+Shift+C：发送原来的 Ctrl+C，中止当前命令
map ctrl+shift+c send_key ctrl+c

# 右键直接粘贴系统剪贴板，兼容普通终端模式和程序接管鼠标时的模式
mouse_map right click ungrabbed,grabbed paste_from_clipboard

# ===================================
# Kitty 分屏配置
# ===================================

enabled_layouts splits

# Ctrl + Shift + ] ：左右分屏
map ctrl+shift+] launch --location=vsplit --cwd=current

# Ctrl + Shift + [ ：上下分屏
map ctrl+shift+[ launch --location=hsplit --cwd=current

# 一键开发三分屏
# 右上 btop，右下默认 Shell
map ctrl+shift+backslash combine : launch --location=vsplit --bias=25 --cwd=current btop : launch --location=hsplit --bias=50 --cwd=current
# ===================================
# 窗口焦点切换（Vim 风格）
# ===================================

map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# 关闭当前分屏
map ctrl+shift+w close_window

# 均分
map ctrl+alt+e layout_action equalize

# 临时最大化当前分屏
map ctrl+shift+z toggle_layout stack

# ===================================
# 分屏外观
# ===================================

window_border_width 1pt
window_margin_width 1 
window_padding_width 2 

active_border_color #89d7c1
inactive_border_color #404650

cursor #9be9c7
cursor_text_color #282432
foreground #ded9eb
background #282432
selection_foreground #ded9eb
selection_background #554b66
url_color #8fcaff

color0 #433d50
color1 #fa8491
color2 #8cebc4
color3 #ffe18b
color4 #80baff
color5 #d6adff
color6 #81d9e8
color7 #ded9eb
color8 #666074
color9 #ff9da8
color10 #a2f2d0
color11 #ffeba5
color12 #9ac9ff
color13 #e1c0ff
color14 #9be5f0
color15 #f3effa

tab_bar_style powerline
active_tab_foreground #282432
active_tab_background #d6adff
inactive_tab_foreground #b9b2ca
inactive_tab_background #332f3d

# Function-key controls
map f1 toggle_maximized
map f2 kitten toggle_decorations.py
map f3 new_tab_with_cwd
